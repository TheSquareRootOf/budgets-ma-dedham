name: Data Pipeline

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Data Pipeline
        # Grants Node.js 4GB of RAM to handle mapping 500,000 JSON rows
        run: node --max-old-space-size=4096 scripts/fetch-data.js

      - name: Commit and Push Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/*.json
          
          # Safely checks if there are new updates before trying to commit
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated weekly data pipeline update"
            git push
          else
            echo "No new data from Socrata to commit."
          fi