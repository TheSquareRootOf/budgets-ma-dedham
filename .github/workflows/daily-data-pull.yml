name: Data Pipeline

on:
  schedule:
    # Runs at 4:00 AM UTC every Sunday (Midnight EST)
    - cron: '0 4 * * 0'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # We intentionally removed 'npm install'. The fetch script uses pure 
      # native Node.js and requires zero heavy web dependencies to run!

      - name: Run Data Pipeline
        run: node scripts/fetch-data.js

      - name: Commit and Push Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/*.json
          git commit -m "Automated weekly data pipeline update" || echo "No changes to commit"
          git push